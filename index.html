<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia 5110 Font Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Nokia 5110 Font Generator</h1>
        <p class="description">Create custom fonts for Nokia 5110 LCD display (84x48 pixels)</p>
        
        <div class="controls">
            <div class="mode-selection">
                <h3>Display Mode</h3>
                <label>
                    <input type="radio" name="mode" value="full">
                    Full Screen (84x48)
                </label>
                <label>
                    <input type="radio" name="mode" value="custom" checked>
                    Custom Size
                </label>
            </div>
            
            <div class="custom-size" id="customSizeInputs">
                <h3>Custom Dimensions</h3>
                <label>
                    Width: <input type="number" id="customWidth" value="6" min="1" max="84">
                </label>
                <label>
                    Height: <input type="number" id="customHeight" value="8" min="1" max="48">
                </label>
                <button id="applyCustomSize">Apply Size</button>
            </div>

            <div class="control-panel">
                <h3>Character Separation</h3>
                <div class="separation-controls">
                    <div class="sep-row">
                        <button type="button" class="sep-toggle" data-side="top">Top</button>
                        <label>px: <input type="number" id="sepTop" min="1" max="47" value="1" disabled></label>
                    </div>
                    <div class="sep-row">
                        <button type="button" class="sep-toggle active" data-side="bottom">Bottom</button>
                        <label>px: <input type="number" id="sepBottom" min="1" max="47" value="1"></label>
                    </div>
                    <div class="sep-row">
                        <button type="button" class="sep-toggle" data-side="left">Left</button>
                        <label>px: <input type="number" id="sepLeft" min="1" max="83" value="1" disabled></label>
                    </div>
                    <div class="sep-row">
                        <button type="button" class="sep-toggle active" data-side="right">Right</button>
                        <label>px: <input type="number" id="sepRight" min="1" max="83" value="1"></label>
                    </div>
                </div>
            </div>
            
            <div class="control-panel">
                <h3>Auto-Render Character</h3>
                <label>
                    Character: <input type="text" id="charInput" maxlength="1" placeholder="a" style="width: 50px; text-align: center;">
                </label>
                <button id="renderCharBtn">Render Character</button>
            </div>

            <div class="control-panel">
                <h3>Render from HEX</h3>
                <label>
                    HEX bytes:
                    <textarea id="hexInput" rows="4" placeholder="Example: 0x7E, 0x11, 0x11, 0x11, 0x7E, 0x00&#10;or paste exported array with comments"></textarea>
                </label>
                <button id="renderHexBtn">Render HEX</button>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="pixelCanvas"></canvas>
            <div class="actions">
                <button id="clearBtn">Clear All</button>
                <button id="exportBtn">Export Font Data</button>
            </div>
        </div>
        
        <div class="output-section">
            <h3>Font Data Output</h3>
            <div class="output-info">
                <span id="dimensionsInfo">Dimensions: 84x48 pixels</span>
            </div>
            <textarea id="outputData" readonly placeholder="Click 'Export Font Data' to generate byte array..."></textarea>
            <button id="copyBtn">Copy to Clipboard</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
